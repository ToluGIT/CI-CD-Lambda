Parameters:
  LambdaExecutionRoleArn:
    Description: ARN of the Lambda execution role
    Type: String
  CodeDeployServiceRoleArn:
    Description: ARN of the CodeDeploy service role
    Type: String
  LambdaFunctionName:
    Description: Name of the Lambda function
    Type: String
  CodeDeployApplicationName:
    Description: Name of the CodeDeploy application
    Type: String
  DeploymentGroupName:
    Description: Name of the CodeDeploy deployment group
    Type: String
  S3BucketName:
    Description: Name of the S3 bucket containing Lambda code
    Type: String
  S3Key:
    Description: Key of the Lambda code in S3 bucket
    Type: String

Resources:
  # Pre-traffic hook Lambda function for validation
  PreTrafficHookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${LambdaFunctionName}-pre-traffic-hook"
      Handler: pre_traffic_hook.lambda_handler
      Role: !Ref LambdaExecutionRoleArn
      Runtime: python3.11
      Timeout: 60
      MemorySize: 128
      Code:
        S3Bucket: !Ref S3BucketName
        S3Key: !Ref S3Key

  # Post-traffic hook Lambda function for validation
  PostTrafficHookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${LambdaFunctionName}-post-traffic-hook"
      Handler: post_traffic_hook.lambda_handler
      Role: !Ref LambdaExecutionRoleArn
      Runtime: python3.11
      Timeout: 60
      MemorySize: 128
      Code:
        S3Bucket: !Ref S3BucketName
        S3Key: !Ref S3Key

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Ref CodeDeployApplicationName
      ComputePlatform: Lambda

  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Handler: lambda_function.lambda_handler
      Role: !Ref LambdaExecutionRoleArn
      Runtime: python3.11
      Timeout: 15
      MemorySize: 128
      Code:
        S3Bucket: !Ref S3BucketName
        S3Key: !Ref S3Key

  LambdaVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref LambdaFunction

  LambdaAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref LambdaFunction
      FunctionVersion: !GetAtt LambdaVersion.Version

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplicationName
      DeploymentGroupName: !Ref DeploymentGroupName
      ServiceRoleArn: !Ref CodeDeployServiceRoleArn
      DeploymentConfigName: CodeDeployDefault.LambdaCanary10Percent5Minutes
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
          - DEPLOYMENT_STOP_ON_ALARM
